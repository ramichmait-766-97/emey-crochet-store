<section class="auth">
  <div class="panel">
    <span class="eyebrow">WELCOME TO EMEY</span>
    <h1>{{ mode === 'login' ? 'Sign in' : 'Create your account' }}</h1>
    @if (settings.settings$ | async; as site) { <p>Members receive {{ site.memberDiscountPercent }}% off website orders.</p> }

    <form (ngSubmit)="submit()">
      <label>Email<input type="email" name="email" [(ngModel)]="email" autocomplete="email" required /></label>
      <label>Password<input type="password" name="password" [(ngModel)]="password" [autocomplete]="mode === 'login' ? 'current-password' : 'new-password'" required minlength="6" /></label>
      <button class="btn primary wide" [disabled]="busy">{{ busy ? 'Please wait…' : mode === 'login' ? 'Sign in' : 'Create account' }}</button>
    </form>

    <div class="or"><span>or continue with</span></div>
    <div class="social">
      <button type="button" [disabled]="busy" (click)="google()">Google</button>
      <button type="button" [disabled]="busy" (click)="apple()">Apple</button>
    </div>

    <button class="switch" type="button" [disabled]="busy" (click)="toggleMode()">
      {{ mode === 'login' ? 'New here? Create an account' : 'Already have an account? Sign in' }}
    </button>

    @if (error) { <div class="error" role="alert">{{ error }}</div> }
  </div>
</section>
